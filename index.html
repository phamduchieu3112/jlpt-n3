<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện thi JLPT N3</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#2563eb;--pr2:#1d4ed8;--or:#c2410c;--orb:#fff1e6;--ok:#16a34a;--fl:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0b1220;--card:#131c2e;--tx:#e5e9f0;--mu:#94a3b8;--bd:#24304a;--orb:#2b1d12;--or:#fdba74}}
:root[data-t=dark]{--bg:#0b1220;--card:#131c2e;--tx:#e5e9f0;--mu:#94a3b8;--bd:#24304a;--orb:#2b1d12;--or:#fdba74}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.w{max-width:1200px;margin:0 auto;padding:0 20px}
.top{background:var(--card);border-bottom:1px solid var(--bd)}.top .w{display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.brand b{font-size:20px;display:block;line-height:1.2}.brand span{font-size:13px;color:var(--mu)}
.sp{flex:1}.who{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);background:#eff6ff22;border-radius:14px;padding:6px 12px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.who small{display:block;color:var(--mu);font-size:12px}
.hero{margin:22px 0;border-radius:20px;padding:28px;color:#fff;background:linear-gradient(120deg,#1d4ed8,#3b82f6);display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.hero .t{flex:1;min-width:260px}.chip{display:inline-block;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:3px 12px;font-size:13px}
.hero h1{margin:10px 0 6px;font-size:32px;line-height:1.2}.hero p{margin:0;opacity:.92;max-width:60ch}
.st{display:flex;gap:12px;flex-wrap:wrap}.st div{background:#ffffff1f;border:1px solid #ffffff3a;border-radius:16px;padding:12px 18px;text-align:center;min-width:120px}
.st small{display:block;font-size:13px;opacity:.9}.st b{font-size:24px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
.tabs button,.fl button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--mu)}
.tabs button.on{background:var(--pr);color:#fff}.fl button{border:1px solid var(--bd);background:var(--card);padding:5px 12px}.fl button.on{border-color:var(--pr);color:var(--pr)}
.h2{display:flex;align-items:center;gap:10px;margin:8px 0}.h2:before{content:"";width:5px;height:26px;border-radius:3px;background:var(--pr)}.h2 h2{margin:0;font-size:22px}
.line{border:1px solid var(--pr);background:var(--card);color:var(--pr);border-radius:12px;padding:8px 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin:16px 0 28px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 1px 3px #0f172a14;display:flex;flex-direction:column;gap:10px}
.c .r{display:flex;justify-content:space-between}.tag{background:#dbeafe;color:#1d4ed8;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600}
.s{background:var(--bg);color:var(--mu);border-radius:8px;padding:2px 10px;font-size:13px}.s.d{background:#dcfce7;color:#15803d}.s.g{background:#fef3c7;color:#b45309}
.c h3{margin:0;font-size:18px}.c p{margin:0;color:var(--mu);font-size:14px}.m{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);border-top:1px solid var(--bd);padding-top:10px}
.pg{height:5px;background:var(--bd);border-radius:3px}.pg i{display:block;height:100%;background:var(--pr);border-radius:3px}
.b1{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:700}.b1:hover{background:var(--pr2)}
.b2{background:var(--orb);color:var(--or);border:1px solid #fdba7455;border-radius:12px;padding:10px;font-weight:700}
.c.off{opacity:.55}.c.off button{pointer-events:none;opacity:.6}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px 0 32px}footer a{color:var(--pr);cursor:pointer}
/* exam */
.ex{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:18px;margin:18px 0}.ex.nn{grid-template-columns:230px minmax(0,1fr)}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.sticky{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}.sticky .w{display:flex;gap:12px;align-items:center;padding:10px 20px}
.tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:var(--bg);border-radius:10px;padding:4px 12px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pal button{aspect-ratio:1;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.pal .an{background:var(--pr);color:#fff;border-color:var(--pr)}.pal .fg{background:var(--fl);color:#000;border-color:var(--fl)}.pal .cu{outline:2px solid var(--tx)}
.q{font-size:20px;line-height:2.1;margin:0 0 6px}.qh{font-size:22px;font-weight:700;margin:0 0 8px}.q ruby rt{font-size:.5em}.q u,.o u{text-underline-offset:5px}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:19px;line-height:2}
.o.on{border-color:var(--pr);background:#2563eb18}.o em{font-style:normal;font-weight:700;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;flex:none;font-size:14px}
.o.on em{background:var(--pr);color:#fff;border-color:var(--pr)}
.qa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.qa audio{width:min(100%,420px)}
.note-warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.55;margin:0 0 12px}
.nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.nav button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 16px}
.nav .fg.on{background:var(--fl);color:#000;border-color:var(--fl)}
textarea{width:100%;min-height:150px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.noruby ruby rt{display:none}
.pv label{display:block;margin:10px 0 4px;font-weight:600}.pv input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);padding:22px;width:min(420px,92vw)}dialog::backdrop{background:#0008}
.pl button{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;margin:6px 0}
#pr{display:none}
@media(max-width:900px){.ex,.ex.nn{grid-template-columns:1fr}.hero h1{font-size:26px}}
@media print{@page{size:A4;margin:14mm}body{background:#fff;color:#000}#app,.top,dialog{display:none!important}#pr{display:block}
.pt{width:100%;border-collapse:collapse}.pt thead{display:table-header-group}.pt tfoot{display:table-footer-group}
.ph{font-size:11pt;border-bottom:1.5px solid #000;padding-bottom:4px}.pf{font-size:9pt;color:#555;border-top:1px solid #999;padding-top:4px}
.pq{break-inside:avoid;margin:0 0 10px;font-size:11pt}.pq .o{border:0;padding:0 0 0 14px;margin:0;font-size:11pt;line-height:1.9;display:inline-flex;width:50%}
.pq .o.on{background:#dbeafe;font-weight:700}.pq .o.on em{background:#000;color:#fff;border-color:#000}.pq .o em{width:20px;height:20px;font-size:9pt}
.sm td,.sm th{border:1px solid #999;padding:2px 6px;font-size:10pt;text-align:center}.sm{border-collapse:collapse;margin:8px 0}
}

る。"]],["友達とラーメン屋に行ったとき、面白いことを教えてもらった。<br>注文のとき、私は遠くにいる店員を大きい声で「すみませーん」と呼んだのだが、気づいてもらえなかった。次に、それを見た友達が「お願いしまーす」と言って呼んだ。すると、店員は気がついて、注文を聞きに来てくれた。友達の話では、「せー」よりも「まー」と伸のばすほうが、口が開いて声が響ひびくので、遠くに届きやすくなる。だから、店員が遠くにいるときは、こう呼ぶといいそうだ。<br><br>面白いことを教えてもらったとあるが、どんなことを教えてもらったか。",["店員が遠くにいるときは、「すみませーん」と言ってから「お願いします」と呼ぶといい。","店員が遠くにいるときは、「お願いしまーす」と言ってから「すみませーん」と呼ぶといい。","店員が遠くにいるときは、「すみませーん」と呼ぶといい。","店員が遠くにいるときは、「お願いしまーす」と呼ぶといい。"]],["これは、大学の事務じむ所の横山さんからエレナさんに届とどいたメールである。<br>エレナ・パスケス様<br>先日は、大学新聞の卒業生インタビューへのご協力、ありがとうございました。エレナさんが日本の企業で頑張っていらっしゃる様子がよくわかりました。<br>話していただいたことを記事にしましたので、このメールに一緒にお送りします。<br>すみませんが、内容を確認していただけませんか。また、当日撮った写真も 4枚送りますので、記事に載のせたい写真を 2枚選んで、写真の番号をお知らせください。<br>よろしくお願いいたします。<br>高木大学 国際センター<br>横山夏子でどのように働いているか書いて、写真と一緒に送ること。<br><br>エレナさんがこのメールで頼たのまれていることは何か。",["卒業生インタビューに協力できるかどうか、返事をすること。","日本の企業で働く卒業生にインタビューをして、記事を書いて送ること。","記事を読んで問題ないかチェックし、どの写真を使いたいか返事をすること。","自分が日本の企業"]],["私が今住んでいる町の名前は「船橋」という。この名前の歴史は、少し変わっている。<br>普通日本で、名前に「橋」がつく町には、過去に同じ名前の橋があったか、現在もある場合が多い。例えば、東京の「日本橋」という町には、日本橋という橋がある。しかし、私の町には、昔から船橋という橋はない。川は流れているが、昔は水量が多くて橋が作れず、小さな船を並べて橋の代わりにしていた。それで、この名前がついたのだそうだ。<br><br>少し変わっているとあるが、どのような点が変わっているのか。",["今では残っていない、昔の橋の名前を町名にしたこと","今も昔も同じ名前の橋がないのに、町名に「橋」がついていること","昔は橋がなかったが、町に名前がついたあとで同じ名前の橋を作ったこと","橋が欲しいと願う人が多かったので、町名に「橋」をつけたこと"]],["6歳の娘がボールを上手に投なげられるようになりたいと言う。私は娘の投げ方の悪い点をいろいろと説明して、何回もボールを投なげさせているが、娘はなかなかうまくならない。昨日、あるテレビ番組でボール投げについて取り上げていた。番組では、子供に大きさや重さの違うさまざまなボールを投げさせたり、紙飛行機を飛とばさせたりして、ちょうどいい力の入いれ方かたを体で覚えさせていた。娘に必要なのは、これかもしれない。<br>次は、このやり方を娘にやらせてみようと思う。<br><br>テレビ番組を見て、「私」は娘のボール投なげがうまくならないのは、なぜだと思ったか。",["上手な投なげ方についての「私」の説明が下手だったから。","繰くり返かえし同じ投げ方で投げる練習をさせていなかったから。","実際に「私」が上手に投げているところを見せていなかったから。","ちょうどいい力の入れ方を体で覚える練習をさせていなかったから。"]],["これは、ある店が客の寺坂さんに書いたメールである。<br>寺坂ゆき様さまいつもご利用いただき、ありがとうございます。<br>2月 4日にいただいたご注文についてのご連絡です。寺坂様ご注文になった革製財布(茶色)ですが、直前の電話注文で品切れになっておりました。<br>大変申し訳ございません。お届とどけできるのは3月上旬になってしまいますが、いかがいたしましょうか。キャンセルもお受けいたしますので、ご希望をお聞かせください。<br>なお、同じ商品の違う色でしたら、すぐにお送りできます。あわせてご検討ください。<br>財布専門店タキグチ 広田t.hirota@saifu-takiguchi.riki.co.jp<br><br>このメールで言いたい た。」",["でございますか","をくださいませんか","したいんでしょうか","させてください"]],["山下:「田中さん、部長に会議の資料を（   ）って頼まれたんですが、どこにありますか。」田中:「ああ、あの棚の中ですよ。」",["取ってくるよ","取ってくるけど","取ってきたの","取ってきてくれ"]],["客: 「あのう、この赤いのは何のアイスクリームですか。」店員: 「トマトのアイスクリーム（   ）。」",["ございます","がございます","でございます","はございます"]],["（レストランで）山田:「7時に予約をした山田ですが。」店員:「山田様ですね。お席にご案内（   ）。どうぞこちらへ。」",["参ります","いたします","なさいます","くださいます"]]]},"1.12":{"mins":30,"q":[["看板",["私の学校では、先生と生徒も胸に看板をつけています。","似ている物が多いので、スーツケースに自分の看板をつけた。","昨日もらった鈴木さんの看板には、課長と書かれていた。","薬局は、あの赤い大きな看板があるお店です。"]],["募集",["父は趣味で古い切手を募集している。","新しくできたスーパーでアルバイトを募集している。","この歌手は今、世界中の若者の人気を募集している。","社員を会議室に募集して、会議を開いた。"]],["消費",["明日までに残りの宿題を全部消費しなければならない。","固い食べ物は胃で消費するのに時間がかかる。","私たちは毎日、電気やガスなどのエネルギーを消費している。","この靴は 3年前から履いているので、底が消費している。"]],["知り合う",["帰りの電車で兄と知り合ったので、一緒に帰宅しました。","このレストランは、雑誌を見て知り合いました。","今回の実験で知り合った結果をレポートに書こうと思います。","中村さんとは、2年前に友達の結婚式で知り合いました。"]],["内側",["部屋の内側から鍵がかかっているので、中に入れません。","相談の内側は誰にも話しませんから、安心してください。","このスープの内側にはいろいろな野菜が入っていますね。","今は外国へ行くよりも、日本の内側を旅行したいです。"]],["諦める",["今日は天気がいいから、傘を諦めてよさそうだ。","台風が来そうなので、あしたの登山を諦めることにした。","家を出てすぐに、鍵をかけるのを諦めたことに気づいた。","悲しい小説だったので、泣くのを諦められなかった。"]],["参加",["赤ちゃんが家族に参加したので、生活が変わった。","山川さんが事故に参加して、足をけがしたそうだ。","あしたは息子と一緒にパーティーに参加するつもりだ。","父は貿易会社に参加しているので、出張は海外が多い。"]],["盛ん",["あしたは試合なので、今日は練習時間が盛んだった。","今日は荷物が盛んなので、大きなかばんが必要だ。","このレストランは、魚も野菜も盛んでおいしい。","この町は以前から外国人との交流が盛んだ。"]],["整理",["机の引き出しを整理して、いらない物を捨てました。","家の廊下が汚れていたので、ぞうきんで整理しました。","長い間使っていない部屋の窓を開けて、空気を整理した。","虫歯になると困るので、毎回、食事の後で歯を整理している。"]],["通り過ぎる",["さっき店の前を自転車で通り過ぎたのは、木村さんだと思う。","バスが遅れて、待ち合わせの時間を通り過ぎてしまった。","今日はご飯の量を通り過ぎて、おなかがいっぱいだ。","締め切りを通り過ぎないように、書類は早めに出したほうがいい。"]],["オーバー",["飛行機の出発時間がオーバーになった。","安いのがなくて、1万円もオーバーしてしまった。","考えすぎて、頭がオーバーになった。","料理がオーバーして、もう食べられない。"]],["欠点",["ここは景色のいい場所だが駅から遠いという欠点がある。","栄養に欠点がないように、食事のメニューを考えている。","ガードレールにぶつかって、車に欠点がついてしまった。","メールを送る前に、メールアドレスに欠点がないか確認した。"]],["親しい",["私は学生のころ、数学より理科の方が親しかった。","彼女はとても親しい道を教えてくれた。","久しぶりに友達と会って、親しかった。","引っ越してきたばかりで、近くにまだ親しい人はいない。"]],["詰める",["明日帰国するので、かばんに洋服やお土産を詰めた。","テーブルに食器を 2枚詰めて、朝食の準備をした。","忘れないように、大切なことをノートに詰めた。","ジャケットのポケットに手を詰めて、切符を出した。"]],["支給",["母の誕生日に、何かプレゼントを支給しようと思う。","これから先生にレポートを支給しに行くつもりだ。","この会社は、家から会社までの交通費を支給してくれる。","買い物のとき、お釣りを支給してもらうのを忘れた。"]],["集合",["あしたは駅前に 7時に集合してください。","短時間に雨が集合していった。","この店にはおいしいワインが集合している。","私の趣味は切手を集合することです。"]],["中古",["これは中古の卵なので、早く食べたほうがいいですね。","彼女は、子どものころから仲良くしている中古の友達です。","あの店に行けば、中古のカメラが安く買えますよ。","ここでアルバイトを始めてから 3年なので、私は中古の店員です。"]],["追い抜く",["マラソンで前の人を追い抜くときに、腕がぶつかってしまった。","この山を追い抜いたら、向こうに海が見えると思います。","この国では二十歳を追い抜くと、もう大人だ。","12時を追い抜いたので、お昼ご飯にしましょう。"]],["見本",["今度のスピーチ大会には、川井さんが学校の見本で出るそうだ。","私の兄は、日本人の見本の身長より 10センチくらい高い。","ここに申込書の書き方の見本があるので、参考にしてください。","ギターを弾くのが初めての人は、見本から教えてもらえます。"]],["だるい",["このスープは味がだるいから、塩を足したほうがいい。","ダイエットをしたら、スカートがだるくなった。","レポートが終わったら少しだるくしたい。","体がだるくて起きられない。"]],["割引",["若者が都会に出ていくので、村の人口が割引になっている。","この美術館は団体で見学を申し込むと料金が割引になる。","ジョギングを始めてから、体重が少し割引になってきた。","最近、仕事が忙しくて、眠る時間が割引になっている。"]],["気づく",["この絵を見ると、ふるさとの景色に気づいて、懐かしくなる。","隣の部屋がにぎやかで、昨日の夜は声に気づいて眠れなかった。","家に着いたとき、電車に忘れ物をしたことに気づいた。","来月から始まる大学生活に気づくと、とても楽しみだ。"]],["栄養",["栄養が足りないと風邪をひきやすくなるから、食事に気をつけている。","わたしの会社は新商品の発売が成功し、どんどん栄養が増えている。","この飛行機は、スピードは速いが、とても多くの栄養がかかる。","大学の講義は難しいけど、栄養が多いので、がんばっています。"]],["ふらふら",["暑い日が続いたので、畑の野菜がふらふらだ。","熱があるから、立って歩くと少し体がふらふらする。","今日はピアノを一日中弾いていたので、指がふらふらだ。","緊張して声がふらふらしたから、うまくスピーチできなかった。"]],["滞在",["特急電車は、出発の 10分前からホームに滞在している。","少し疲れたので、しばらく喫茶店に滞在しませんか。","わたしの車は、来週まで修理のため工場に滞在しています。","あしたから一週間、仕事で東京に滞在します。"]],["報告",["テレビの天気予報で明日の天気の報告をしている。","リーさんから、クラスのみんなで博物館に行こうという報告があった。","けんかをした友人から電話があって、会って謝りたいという報告をされた。","アンケートの結果について、今日の会議で報告があった。"]],["満員",["アルバイト店員を募集したが、なかなか満員にならない。","この駅の近くの道はいつも満員で、とても歩きにくい。","参加者が満員になったので、会話を始めます。","会場は満員で、座れない人もたくさんいた。"]],["かき混ぜる",["日本語の文章は漢字とひらがながかき混ぜられている。","牛乳に卵と砂糖を入れたら、よくかき混ぜてください。","大事な手紙を古い本などにかき混ぜて捨ててしまった。","このクラスにはいろいろな国の留学生がかき混ぜられている。"]],["発生",["この工場から、多くの新しい商品が発生している。","海の近くに新しいホテルがたくさん発生している。","火災が発生したときのために、みんなで避難訓練をした。","その映画を見て、日本に対する興味が発生した。"]],["お互いに",["あの夫婦は、どんなときでもお互いに協力し合って生きてきた。","昨日、お互いにエレベーターに乗った人は、小学校の時の先生だった。","学校で風邪が流行していて、クラスメートはお互いに授業を休んでいる。","イチゴのケーキとチョコのケーキはお互いにおいしそうで、選べない。"]]]},"1.13":{"mins":30,"q":[["赤ちゃんは、よく泣くのが普通だ。生まれたばかりの赤ちゃんの泣き声は、まだあまり大きくないので、かわいいと思える。しかし、夜、赤ちゃんが泣き続けてなかなか眠らないと、親は疲れてストレスがたまってくる。親なら誰でも経験することだが、最近、日本では①それを解決するのに役に立つ研究が進んでいる。赤ちゃんが泣くことと眠ることについての研究だ。<br>研究では、泣いている赤ちゃんの多くは、親が抱だいて歩くとおとなしくなることがわかった。それは、自然の中で生きる動物を見れば、納得できる。動物の親は、近くに危険な動物がいたら、子供を安全な場所に運ぼうとする。このときに騒ぐと見つかってしまうので、親に運ばれている間、子供は自然におとなしくなるのだ。人間の赤ちゃんも動物の子供と②同じなのだと考えられる。<br>抱だいて 5 分ぐらい歩くと、赤ちゃんは寝始めることが多い。その後、すぐにベッドに移すのではなく、抱だいたままいすに座って、深く眠るまで 8分ぐらい待ってから移すと、目を覚ましにくいこともわかった。ここで一つ、意外な注意点がある。赤ちゃんを置くとき、多くの親は、起こさないように、ゆっくり静かに置こうとする。しかし、研究では、ゆっくり置くより速く置いたほうが目を覚ましにくいことがわかった。赤ちゃんは、親が体から<br>自分を離はなしてベッドに移そうとしている間に、状態の③変化を感じる。変化を長く感じていると目を覚ましてしまうので、その時間は短いほうがいいのだ。<br>泣いている赤ちゃんを眠らせたいときには、この研究でわかった方法が役に立つだろう。<br>置く。<br><br>①それを解決するとあるが、何を解決するか。",["赤ちゃんがなぜ泣いているのかわからないことによる親の不安","生まれたばかりの赤ちゃんの泣き声が大きくないという親の心配","赤ちゃんが泣き続けて眠らないことで、親の体と心に悪い影響が出る問題","抱いて歩いても、泣いている赤ちゃんがおとなしくならないという親の苦労"]],["赤ちゃんは、よく泣くのが普通だ。生まれたばかりの赤ちゃんの泣き声は、まだあまり大きくないので、かわいいと思える。しかし、夜、赤ちゃんが泣き続けてなかなか眠らないと、親は疲れてストレスがたまってくる。親なら誰でも経験することだが、最近、日本では①それを解決するのに役に立つ研究が進んでいる。赤ちゃんが泣くことと眠ることについての研究だ。<br>研究では、泣いている赤ちゃんの多くは、親が抱だいて歩くとおとなしくなることがわかった。それは、自然の中で生きる動物を見れば、納得できる。動物の親は、近くに危険な動物がいたら、子供を安全な場所に運ぼうとする。このときに騒ぐと見つかってしまうので、親に運ばれている間、子供は自然におとなしくなるのだ。人間の赤ちゃんも動物の子供と②同じなのだと考えられる。<br>抱だいて 5 分ぐらい歩くと、赤ちゃんは寝始めることが多い。その後、すぐにベッドに移すのではなく、抱だいたままいすに座って、深く眠るまで 8分ぐらい待ってから移すと、目を覚ましにくいこともわかった。ここで一つ、意外な注意点がある。赤ちゃんを置くとき、多くの親は、起こさないように、ゆっくり静かに置こうとする。しかし、研究では、ゆっくり置くより速く置いたほうが目を覚ましにくいことがわかった。赤ちゃんは、親が体から<br>自分を離はなしてベッドに移そうとしている間に、状態の③変化を感じる。変化を長く感じていると目を覚ましてしまうので、その時間は短いほうがいいのだ。<br>泣いている赤ちゃんを眠らせたいときには、この研究でわかった方法が役に立つだろう。<br>置く。<br><br>②同じだとあるが、人間の赤ちゃんと動物の子供は、何が同じだと言っているのか。",["親に運ばれているときに、自然に静かになること","危険な動物の近くにいるときに、騒がなくなること","知らない場所に行くと、不安になって騒ぐこと","親が近くにいると、自然に静かになること"]],["赤ちゃんは、よく泣くのが普通だ。生まれたばかりの赤ちゃんの泣き声は、まだあまり大きくないので、かわいいと思える。しかし、夜、赤ちゃんが泣き続けてなかなか眠らないと、親は疲れてストレスがたまってくる。親なら誰でも経験することだが、最近、日本では①それを解決するのに役に立つ研究が進んでいる。赤ちゃんが泣くことと眠ることについての研究だ。<br>研究では、泣いている赤ちゃんの多くは、親が抱だいて歩くとおとなしくなることがわかった。それは、自然の中で生きる動物を見れば、納得できる。動物の親は、近くに危険な動物がいたら、子供を安全な場所に運ぼうとする。このときに騒ぐと見つかって   `<button class="b1" onclick="start(${bk},${i},'real')">${st=="doing"?"Làm tiếp":"Thi thật (đếm ngược)"}</button><button class="b2" onclick="start(${bk},${i},'free')">Làm tự do (không giới hạn thời gian)</button>`}</div>`}).join("");
 $("#app").innerHTML=`<div class="top"><div class="w"><div class="logo">N3</div><div class="brand"><b>Luyện thi JLPT N3</b><span>Hệ thống làm đề trực tuyến • JLPT N3</span></div><div class="sp"></div>
 <div class="who" onclick="who()"><div class="av">${p?esc(ini(p.name)):"+"}</div><div><b>${p?esc(p.name):"Thêm người làm"}</b><small>${p?"Lớp: "+esc(p.cls||"–")+" • Bấm để sửa":"Bấm để tạo hồ sơ"}</small></div></div></div></div>
 <div class="w"><div class="hero"><div class="t"><span class="chip">Chương trình ${esc(b.s)}</span><h1>${esc(b.n)}</h1><p>Xin chào ${p?esc(p.name):"bạn"}! Chọn một đề bên dưới để bắt đầu làm bài. Làm xong, web xuất file PDF kèm tên và ngày làm để gửi giáo viên.</p></div>
 <div class="st"><div><small>Tổng số đề</small><b>${b.d.length}</b></div><div><small>Đã hoàn thành</small><b>${done} / ${b.d.length}</b></div><div><small>Thời gian làm TB</small><b>${cnt?fmt(Math.round(secs/cnt)):"--"}</b></div></div></div>
 <div class="bar"><div class="tabs">${B.map((x,i)=>`<button class="${i==bk?"on":""}" onclick="bk=${i};home()">${x.n}</button>`).join("")}</div><input type="text" placeholder="Tìm theo chủ đề…" value="${esc(flt)}" oninput="flt=this.value;clearTimeout(window.ft);window.ft=setTimeout(()=>{home();const i=$('.bar input');i.focus();i.setSelectionRange(99,99)},250)" style="padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)"><div class="sp"></div>
 <label style="font-size:14px"><input type="checkbox" ${S.ruby?"checked":""} onchange="S.ruby=this.checked?1:0;save();ap()"> Furigana</label></div>
 <div class="h2"><h2>Danh sách đề</h2><div class="sp"></div><button class="line" onclick="who()">Cập nhật thông tin người làm</button></div><div class="grid">${cards}</div></div>
 <footer>Web được tạo bởi Phạm Đức Hiếu<br><a onclick="bak()">Sao lưu dữ liệu</a> • <a onclick="$('#imp').click()">Khôi phục</a> • <a onclick="th()">Sáng/Tối</a><input id="imp" type="file" accept=".json" hidden onchange="rest(this.files[0])"></footer>`;ap()}
function ap(){document.body.classList.toggle("noruby",!S.ruby);if(S.th)document.documentElement.dataset.t=S.th}
function th(){S.th=(document.documentElement.dataset.t=="dark")?"light":"dark";save();ap()}
function who(){const d=$("#dg"),ps=Object.entries(S.p),p=prof();
 d.innerHTML=`<h3 style="margin-top:0">Người làm</h3><div class="pl">${ps.map(([k,v])=>`<button onclick="S.cur='${k}';save();$('#dg').close();home()">${k==S.cur?"● ":""}${esc(v.name)} ${v.cls?"– "+esc(v.cls):""}</button>`).join("")}</div>
 <div class="pv"><label>Họ tên (bắt buộc)</label><input type="text" id="pn" value="${p?esc(p.name):""}"><label>Lớp</label><input type="text" id="pc" value="${p?esc(p.cls):""}"></div>
 <div class="row"><button class="b1" onclick="sv(0)">${p?"Lưu thay đổi":"Tạo hồ sơ"}</button><button class="line" onclick="sv(1)">Thêm người mới</button>${p?`<button class="b2" onclick="del()">Xóa hồ sơ này</button>`:""}<button class="line" onclick="$('#dg').close()">Đóng</button></div>`;d.showModal()}
function sv(nw){const n=$("#pn").value.trim(),c=$("#pc").value.trim();if(!n){alert("Cần nhập họ tên.");return}
 if(nw||!prof()){const id="u"+Date.now();S.p[id]={name:n,cls:c,r:{}};S.cur=id}else{prof().name=n;prof().cls=c}save();$("#dg").close();view=="home"?home():view=="exam"?ex():0}
function del(){if(!confirm("Xóa hồ sơ và toàn bộ dữ liệu của người này?"))return;delete S.p[S.cur];S.cur=Object.keys(S.p)[0]||"";save();$("#dg").close();home()}
function bak(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="n3-sao-luu-"+dmy().replace(/\//g,"")+".json";a.click()}
function rest(f){if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.p)throw 0;S=o;save();home()}catch(e){alert("File sao lưu không hợp lệ.")}})}
function start(b,d,mode,redo){if(!prof()){who();return}if(!getD(b,d)){alert("Đề này chưa có dữ liệu câu hỏi.");return}const k=rk(b,d);if(redo){if(!confirm("Làm lại sẽ xóa đáp án và ghi chú của đề này. Tiếp tục?"))return;delete prof().r[k]}
 R=run(b,d,1);R.b=b;R.d=d;if(R.st!="doing"){R.mode=mode;R.sec=0;R.t0=Date.now();R.st="doing"}else if(mode!=R.mode&&!confirm("Đề đang làm ở chế độ khác. Giữ chế độ cũ?")){R.mode=mode}
 cur=0;view="exam";save();ex()}
function left(){return Math.max(0,getD(R.b,R.d).mins*60-R.sec)}
function ex(){clearInterval(window.tk);const dt=getD(R.b,R.d),q=dt.q;
 window.tk=setInterval(()=>{R.sec++;const e=$("#tm");if(e)e.textContent=R.mode=="real"?fmt(left()):fmt(R.sec);if(R.mode=="real"&&left()==0){clearInterval(window.tk);alert("Hết giờ. Bài sẽ được nộp.");fin(1)}if(R.sec%15==0)save()},1000);
 $("#app").innerHTML=`<div class="sticky"><div class="w"><button class="line" onclick="exit()">‹ Thoát</button><b>${esc(B[R.b].d[R.d])} – ${esc(B[R.b].n)}</b><div class="sp"></div><span class="tm" id="tm">${R.mode=="real"?fmt(left()):fmt(R.sec)}</span><button class="line" onclick="pz()">Tạm dừng</button><button class="b1" style="padding:8px 18px" onclick="fin()">Hoàn thành</button></div></div>
 <div class="w"><div class="ex ${showN?"":"nn"}"><div class="p"><b>Câu hỏi</b><div class="pal" style="margin-top:10px">${q.map((x,i)=>`<button class="${R.a[i]>=0?"an":""} ${R.f[i]?"fg":""} ${i==cur?"cu":""}" onclick="go(${i})">${x[3]||i+1}</button>`).join("")}</div>
 <p style="font-size:12px;color:var(--mu)">Xanh: đã làm • Vàng: đánh dấu • Xám: chưa làm</p></div>
 <div class="p">${dt.note?`<div class="note-warn">${esc(dt.note)}</div>`:""}${qh(cur)}</div>${showN?`<div class="p"><b>Ghi chú câu ${getD(R.b,R.d).q[cur][3]||cur+1}</b><textarea id="nt" placeholder="Ghi chú riêng cho câu này…" oninput="R.n[${cur}]=this.value;save()">${esc(R.n[cur]||"")}</textarea><b style="display:block;margin-top:12px">Ghi chú chung cả đề</b><textarea id="nd" oninput="R.nd=this.value;save()">${esc(R.nd)}</textarea></div>`:""}</div></div>`;ap()}
function qh(i){const x=getD(R.b,R.d).q[i],hd=x[2],m=x[4]||{};const txt=fm(x[0]).replace(/\n/g,"<br>");let h=`<div class="${hd?"qh":"q"}">(${String(x[3]||i+1).padStart(2,"0")}) ${txt}</div>`;if(m.image)h+=`<img src="${encodeURI(m.image)}" style="max-width:100%;max-height:340px;border-radius:10px;margin:8px 0;display:block">`;if(m.audio)h+=`<div class="qa"><audio id="qa${i}" controls preload="none" src="${encodeURI(m.audio)}"></audio><button class="b2" style="padding:7px 14px" onclick="document.getElementById('qa${i}').play()">▶ Phát</button></div>`;h+=x[1].map((o,j)=>`<button class="o ${R.a[i]==j?"on":""}" onclick="pk(${i},${j})"><em>${j+1}</em><span>${fm(o)}</span></button>`).join("");h+=`<div class="nav"><button onclick="go(${i-1})" ${i?"":"disabled"}>‹ Trước</button><button onclick="go(${i+1})" ${i<getD(R.b,R.d).q.length-1?"":"disabled"}>Sau ›</button><button class="fg ${R.f[i]?"on":""}" onclick="R.f[${i}]=R.f[${i}]?0:1;save();ex()">⚑ Đánh dấu xem lại</button><button onclick="showN=!showN;ex()">${showN?"Ẩn":"Hiện"} ghi chú</button></div>`;return h}
function pk(i,j){R.a[i]=R.a[i]==j?-1:j;save();ex()}
function go(i){const n=getD(R.b,R.d).q.length;if(i<0||i>=n)return;cur=i;ex()}
function pz(){clearInterval(window.tk);const d=$("#dg");d.innerHTML=`<h3 style="margin-top:0">Đã tạm dừng</h3><p>Đồng hồ đang dừng.</p><button class="b1" onclick="$('#dg').close();ex()">Tiếp tục làm bài</button>`;d.showModal();d.onclose=()=>{d.onclose=null;ex()}}
function exit(){clearInterval(window.tk);save();home()}
function fin(force){const q=getD(R.b,R.d).q,em=R.a.map((a,i)=>a<0?(q[i][3]||i+1):0).filter(Boolean),fg=R.f.map((a,i)=>a?(q[i][3]||i+1):0).filter(Boolean);
 if(!force){let m="";if(em.length)m+="Chưa làm: câu "+em.join(", ")+".\n";if(fg.length)m+="Đang đánh dấu xem lại: câu "+fg.join(", ")+".\n";if(!confirm((m||"")+"Nộp bài và chuyển sang bước xuất PDF?"))return}
 clearInterval(window.tk);R.st="done";R.t1=Date.now();R.date=R.date||dmy();save();preview(R.b,R.d)}
function preview(b,d){R=run(b,d);R.b=b;R.d=d;view="pv";const p=prof(),q=getD(b,d).q;
 $("#app").innerHTML=`<div class="top"><div class="w"><div class="logo">N3</div><div class="brand"><b>Bài nộp</b><span>${esc(B[b].d[d])} – ${esc(B[b].n)}</span></div></div></div><div class="w pv" style="max-width:640px;margin:22px auto"><div class="p">
 <label>Họ tên</label><input type="text" id="vn" value="${esc(p.name)}"><label>Lớp</label><input type="text" id="vc" value="${esc(p.cls)}"><label>Ngày làm (dd/mm/yyyy)</label><input type="text" id="vd" value="${esc(R.date||dmy())}">
 <p style="color:var(--mu)">Thời gian làm: ${fmt(R.sec)} • Đã trả lời ${R.a.filter(x=>x>=0).length}/${q.length} câu</p>
 <label style="font-weight:400"><input type="checkbox" id="vk"> Kèm ghi chú vào PDF</label><label style="font-weight:400"><input type="checkbox" id="vr"> Ghi credit vào PDF</label>
 <div class="row"><button class="b1" onclick="pdf()">Xuất PDF</button><button class="line" onclick="txt()">Tải đáp án (.txt)</button><button class="line" onclick="home()">Về trang chủ</button></div>
 <p style="font-size:13px;color:var(--mu)">Trong hộp thoại in của Mac: chọn <b>Lưu dưới dạng PDF</b> và tắt <b>Đầu trang và chân trang</b>.</p></div></div>`;ap()}
function info(){const n=$("#vn").value.trim(),c=$("#vc").value.trim(),d=$("#vd").value.trim();if(!n){alert("Cần nhập họ tên.");return null}if(!toIso(d)){alert("Ngày làm phải có dạng dd/mm/yyyy.");return null}const p=prof();p.name=n;p.cls=c;R.date=d;save();return{n,c,d}}
const na=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"");
function pdf(){const f=info();if(!f)return;const q=getD(R.b,R.d).q,kn=$("#vk").checked,kr=$("#vr").checked;
 const h=`${esc(f.n)} &nbsp;|&nbsp; Lớp: ${esc(f.c||"–")} &nbsp;|&nbsp; Ngày làm: ${esc(f.d)}`;
 const smx=(()=>{let t="<table class=sm>";for(let r=0;r<q.length;r+=10){t+="<tr>"+q.slice(r,r+10).map((x,i)=>`<th>${x[3]||r+i+1}</th>`).join("")+"</tr><tr>"+q.slice(r,r+10).map((_,i)=>`<td>${R.a[r+i]>=0?R.a[r+i]+1:"–"}</td>`).join("")+"</tr>"}return t+"</table>"})();
 const body=`<div style="font-size:15pt;font-weight:700">${esc(B[R.b].n)} – ${esc(B[R.b].d[R.d])}</div><p style="font-size:11pt;line-height:1.7">Họ tên: <b>${esc(f.n)}</b><br>Lớp: <b>${esc(f.c||"–")}</b><br>Ngày làm: <b>${esc(f.d)}</b><br>Thời gian làm bài: <b>${fmt(R.sec)}</b></p><b>Tóm tắt đáp án</b>${smx}<div style="break-after:page"></div>`+
 q.map((x,i)=>`<div class="pq"><div class="${x[2]?"qh":"q"}" style="font-size:12pt;line-height:2.2">(${String(x[3]||i+1).padStart(2,"0")}) ${fm(x[0]).replace(/\n/g,"<br>")}</div>${x[1].map((o,j)=>`<span class="o ${R.a[i]==j?"on":""}"><em>${j+1}</em>${R.a[i]==j?"● ":""}${fm(o)}</span>`).join("")}${kn&&R.n[i]?`<div style="font-size:10pt;margin-top:4px">Ghi chú: ${esc(R.n[i])}</div>`:""}</div>`).join("")+(kn&&R.nd?`<div class="pq"><b>Ghi chú chung:</b> ${esc(R.nd)}</div>`:"");
 $("#pr").innerHTML=`<table class="pt"><thead><tr><td><div class="ph">${h}</div></td></tr></thead><tfoot><tr><td><div class="pf">${esc(B[R.b].n)} – ${esc(B[R.b].d[R.d])}${kr?" • Web được tạo bởi Phạm Đức Hiếu":""}</div></td></tr></tfoot><tbody><tr><td>${body}</td></tr></tbody></table>`;
 const t0=document.title;document.title=`${na(B[R.b].n)}_${na(B[R.b].d[R.d])}_${na(f.n)}_${f.d.replace(/\//g,"")}`;setTimeout(()=>{window.print();document.title=t0},200)}
function txt(){const f=info();if(!f)return;const q=getD(R.b,R.d).q;let s=`${B[R.b].n} - ${B[R.b].d[R.d]}\nHọ tên: ${f.n}\nLớp: ${f.c}\nNgày làm: ${f.d}\n\n`+q.map((_,i)=>`${i+1}: ${R.a[i]>=0?R.a[i]+1:"(bỏ trống)"}`).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/plain"}));a.download=na(f.n)+"_dapan.txt";a.click()}
document.addEventListener("keydown",e=>{if(view!="exam")return;const t=e.target.tagName;if((e.metaKey||e.ctrlKey)&&e.key=="Enter"){fin();return}if(t=="TEXTAREA"||t=="INPUT")return;
 if(e.key=="ArrowRight")go(cur+1);else if(e.key=="ArrowLeft")go(cur-1);else if("1234".includes(e.key)&&e.key)pk(cur,+e.key-1);else if(e.key=="f"||e.key=="F"){R.f[cur]=R.f[cur]?0:1;save();ex()}else if(e.key=="n"||e.key=="N"){e.preventDefault();const n=$("#nt");n&&n.focus()}});
load();home();if(!prof())setTimeout(who,300);
</script></body></html>
